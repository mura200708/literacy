<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>表の例</title>
  <style>
    table {
      border-collapse: collapse;
      width: 300px;
    }

    th, td {
      border: 1px solid black;
      padding: 8px;
      text-align: center;
    }

    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <th>名前</th>
      <th>年齢</th>
    </tr>
    <tr>
      <td>田中</td>
      <td>20</td>
    </tr>
    <tr>
      <td>佐藤</td>
      <td>22</td>
    </tr>
  </table>

</body>
</html>
